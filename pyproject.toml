[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "uplift-policy"
version = "0.1.0"
requires-python = ">=3.11,<3.14"
dependencies = [
  "duckdb==1.5.5",
  "lightgbm==4.7.0",
  "matplotlib==3.11.1",
  "numpy==2.5.1",
  "pandas==3.0.5",
  "PyYAML==6.0.3",
  "scikit-learn==1.9.0",
  "streamlit==1.60.0",
]

[project.optional-dependencies]
dev = ["pytest==9.1.1"]

[project.scripts]
uplift-policy = "uplift_policy.pipeline:main"

[tool.setuptools.packages.find]
where = ["src"]
