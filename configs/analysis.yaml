seed: 20260803
propensity: 0.85
capacities: [0.05, 0.10, 0.20, 0.50, 1.00]

paths:
  raw_data: data/raw/criteo-uplift-v2.1.csv.gz
  processed_data: data/processed/criteo
  model_dir: artifacts/models
  results_dir: results

features:
  continuous: [f0, f2, f7, f10]
  categorical: [f1, f3, f4, f5, f6, f8, f9, f11]
  treatment: treatment
  outcomes: [conversion, visit]
  exposure: exposure

split:
  train_buckets: [0, 1, 2, 3, 4, 5]
  validation_buckets: [6, 7]
  test_buckets: [8, 9]
  bucket_count: 10
  hash: duckdb_hash

duckdb:
  threads: 8
  memory_limit: 8GB
  row_group_size: 500000

lightgbm:
  learning_rate: 0.05
  num_leaves: 31
  min_data_in_leaf: 1000
  lambda_l2: 1.0
  feature_fraction: 1.0
  bagging_fraction: 1.0
  max_bin: 255
  max_rounds: 2000
  early_stopping_rounds: 50
  deterministic: true
  force_col_wise: true
  num_threads: 8

dr_learner:
  folds: 3
  fold_seed: 20260804

treatment_diagnostic:
  max_rounds: 300
  early_stopping_rounds: 30

bootstrap:
  replicates: 1000
  seed: 20260805
